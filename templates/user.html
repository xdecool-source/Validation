<!DOCTYPE html>
<html>
<head>
    <title>Disponibilité Ping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Code Pin -->
<div style="position:absolute; top:10px; right:10px;">
    <div id="pinContainer">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
    </div>
</div>

<!-- App Disponibilité -->
<div id="appContent" style="display:none;">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow p-4 w-100" style="max-width: 420px; border-radius: 16px;">
            
            <h2 class="text-center mb-4">🏓 Disponibilité Championnat</h2>

            <form id="form">
                <div style="max-width: 300px; margin: auto;">

                    <!-- Licence -->
                    <div class="mb-3">
                        <label class="form-label">N° de licence</label>
                        <input type="text" id="license" class="form-control text-center" required>
                    </div>

                    <div id="player_name" class="mb-1 fw-bold text-center"></div>
                    <div id="player_info" class="mb-3 text-center small text-muted"></div>

                    <!-- Journée -->
                    <div class="mb-3">
                        <label>Journée</label>
                        <select id="match_day_id" class="form-select"></select>
                    </div>

                    <!-- Créneau -->
                    <div class="mb-3">
                        <label>Créneau</label>
                        <select id="slot_id" class="form-select"></select>
                    </div>

                    <!-- Disponibilité -->
                    <div class="mb-4">
                        <label>Disponibilité</label>
                        <select id="availability" class="form-select">
                            <option value="disponible">✅ Disponible</option>
                            <option value="indisponible">❌ Indisponible</option>
                        </select>
                    </div>

                    <!-- Bouton -->
                    <div class="text-center">
                        <button type="submit" id="submitBtn"
                            class="rounded-circle d-flex align-items-center justify-content-center"
                            style="
                                width:40px;
                                height:40px;
                                background: linear-gradient(135deg, #22955c, #09ed7b);
                                color:white;
                                border:none;
                                box-shadow: 0 4px 12px rgba(13, 152, 69, 0.831);
                            ">
                            <i class="bi bi-check-lg" style="pointer-events:none;"></i>
                        </button>
                    </div>
                </div>
            </form>

            <div id="result" class="mt-3 text-center fw-bold"></div>

            <!-- 🔥 SECTION ADMIN (AJOUTÉE ICI) -->
            <form id="importForm" class="mt-3">
                <div class="d-flex align-items-center gap-2">
                    <!-- input natif -->
                    <input type="file" id="fileInput" class="form-control form-control-sm">
                    <!-- bouton icône -->
                    <button type="submit" class="btn btn-success btn-sm" title="Importer">
                        ⬆️
                    </button>
                </div>
            </form>
            <div id="importMessage" class="small mt-2 text-center"></div>
            <!-- 🔥 FIN SECTION ADMIN -->

        </div>
    </div>
</div>

<!-- JS -->
<script src="/static/pin.js"></script>
<script src="/static/app.js"></script>

<div style="position:fixed; bottom:5px; right:10px; font-size:11px; opacity:0.5; color: white;">
Tennis de Table Thuirinois XDC Validation Version: v1.3
</div>
</body>
</html>
