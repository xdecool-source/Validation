<!DOCTYPE html>
<html>
<head>
    <title>Disponibilité Ping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS -->
    <meta name="theme-color" content="#3e4750">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Code Pin -->
<div style="position:absolute; top:10px; right:10px;">
    <div id="pinContainer">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
        <input type="text" maxlength="1" class="pin" inputmode="numeric">
    </div>
</div>

<!-- App Disponibilité -->
<div id="appContent" style="display:none;">
    <div class="py-4 text-center">
        <div class="card shadow p-4 mx-auto" style="max-width: 280px; border-radius: 16px;">
            <h2 class="text-center mb-4">🏓 Disponibilité 🏓 </h2>
            <form id="form">
                <div class="mx-auto">
                    <!-- Licence -->
                    <div class="mb-3">
                        <label class="form-label">Votre Numéro de licence</label>
                        <input 
                    id="license"
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    />
                    </div>
                    <div id="player_name" class="mb-1 fw-bold text-center"></div>
                    <div id="player_info" class="mb-3 text-center small text-muted"></div>
                    <!-- Journée -->
                    <label for="match_day_id"> Choix Journée  </label>
                    <select id="match_day_id"></select>
                    <!-- Dispo  -->
                    <div id="matchDaysContainer"></div>
                    <!-- Bouton -->
                    <div class="text-center">
                        <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                        Valider
                        </button>
                    </div>
                </div>
            </form>
            <div id="result" class="mt-3 text-center fw-bold"></div>

            <!-- SECTION ADMIN (AJOUTÉE ICI) -->
            <form id="importForm" class="mt-3" style="display:none;">
                <div class="d-flex align-items-center gap-2">
                    <!-- input natif -->
                    <input type="file" id="fileInput" class="form-control form-control-sm">
                    <!-- bouton icône -->
                    <button type="submit" class="btn btn-success btn-sm" title="Importer">
                        ⬆️
                    </button>
                </div>
            </form>
            <div id="importMessage" class="small mt-2 text-center"></div>
            <!-- FIN SECTION ADMIN -->
        </div>
    </div>
</div>

<!-- JS -->
<script src="/static/pin.js"></script>
<script src="/static/app.js"></script>

<div style="position:fixed; bottom:5px; right:10px; font-size:11px; opacity:0.5; color: white;">
Tennis de Table Thuirinois XDC Validation Version: v2.0
</div>
</body>
</html>
