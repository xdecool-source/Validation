<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .login { background: #3b82f6; color: white; }
        .upload { background: #22c55e; color: white; }
        .logout { background: #ef4444; color: white; }

        input {
            width: 100%;
            margin-top: 10px;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Admin Panel TT Thuirinois</h2>

    <button class="login" onclick="login()">Connexion</button>

    <input type="file" id="fileInput">
    <button class="upload" onclick="upload()">Importer joueurs</button>

    <button class="logout" onclick="logout()">Déconnexion</button>

    <div class="status" id="status"></div>
</div>

<script>

function setStatus(msg) {
    document.getElementById("status").innerText = msg;
}

// 🔐 LOGIN
async function login() {
    const code = prompt("Code admin :");

    const res = await fetch(`/check-access?code=${code}`);
    const data = await res.json();

    if (data.ok) {
        localStorage.setItem("access", data.access_token || data.token);
        localStorage.setItem("refresh", data.refresh_token || "");
        setStatus("✅ Connecté");
    } else {
        setStatus("❌ Code incorrect");
    }
}

// 📤 UPLOAD
async function upload() {

    let token = localStorage.getItem("access");

    if (!token) {
        setStatus("⚠️ Connecte-toi d'abord");
        return;
    }

    const fileInput = document.getElementById("fileInput");

    if (!fileInput.files.length) {
        setStatus("⚠️ Aucun fichier");
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    let res = await fetch("/import-joueur", {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + token
        },
        body: formData
    });

    // 🔁 refresh automatique si token expiré
    if (res.status === 401) {
        await refreshToken();
        token = localStorage.getItem("access");

        res = await fetch("/import-joueur", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            },
            body: formData
        });
    }

    const data = await res.json();

    if (data.message) {
        setStatus(`✅ ${data.message} (${data.nb || 0} joueurs)`);

        // 🧹 reset du fichier
        fileInput.value = "";
    } else {
        setStatus("❌ " + data.error);
    }
}

// 🔁 REFRESH TOKEN
async function refreshToken() {
    const refresh = localStorage.getItem("refresh");

    const res = await fetch("/refresh", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ refresh_token: refresh })
    });

    const data = await res.json();
    localStorage.setItem("access", data.access_token);
}

// 🔓 LOGOUT
function logout() {
    localStorage.clear();
    setStatus("Déconnecté");
}

// 🔍 état au chargement
if (localStorage.getItem("access")) {
    setStatus("🟢 Déjà connecté");
}

</script>

</body>
</html>
